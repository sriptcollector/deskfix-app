[package]
name = "deskfix"
version = "1.0.0"
description = "DeskFix: AI that sees your screen, fixes computer problems, and teaches you"
authors = ["Westward"]
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "deskfix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.7"
enigo = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
rand = "0.8"
sysinfo = "0.39"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }
core-foundation-sys = "0.8"
accessibility-sys = "0.1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
uiautomation = "0.16"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
